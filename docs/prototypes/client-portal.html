<style>
/* Layout: sign-in card, then a portal with a navy masthead, a left tab rail (top strip on phones) and one working panel per tab. Client brand colours appear only inside their own content previews and brand assets. */
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --surface-2:#F7F8F6; --ink:#16242B; --muted:#5B6A70; --line:#DCE1DF;
  --navy:#0E2A36; --navy-2:#18404F; --on-navy:#FFFFFF; --on-navy-muted:#B9C7CD;
  --gold:#B88A35; --gold-soft:#F4ECDC; --gold-ink:#7C5A1A;
  --good:#2E7D4F; --good-soft:#E3F2E8; --warn:#A86A00; --warn-soft:#FBF0D9; --bad:#B3261E; --bad-soft:#FBE4E2; --info:#1F5E8C; --info-soft:#E1EEF7;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1A21; --surface:#12252E; --surface-2:#0F2028; --ink:#E6EDF0; --muted:#94A6AE; --line:#24404C;
  --navy:#081820; --navy-2:#1C4253; --gold:#D4A957; --gold-soft:#2E2715; --gold-ink:#E8C67F;
  --good:#5FBF86; --good-soft:#163024; --warn:#E0A643; --warn-soft:#33270F; --bad:#F08A82; --bad-soft:#3A1A18; --info:#7DB6E0; --info-soft:#14293A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A21; --surface:#12252E; --surface-2:#0F2028; --ink:#E6EDF0; --muted:#94A6AE; --line:#24404C;
  --navy:#081820; --navy-2:#1C4253; --gold:#D4A957; --gold-soft:#2E2715; --gold-ink:#E8C67F;
  --good:#5FBF86; --good-soft:#163024; --warn:#E0A643; --warn-soft:#33270F; --bad:#F08A82; --bad-soft:#3A1A18; --info:#7DB6E0; --info-soft:#14293A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-weight:850;font-stretch:108%;font-size:clamp(26px,3.4vw,34px);line-height:1.05}
h2{font-weight:800;font-size:19px}
h3{font-weight:700;font-size:15px}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--navy-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .btn.pri{background:var(--gold);border-color:var(--gold);color:#0B1A21}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--gold);border-color:var(--gold);color:#0B1A21}}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:600;cursor:pointer;text-decoration:underline;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.s-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.s-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.s-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.s-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.s-gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.ribbon{background:var(--gold-soft);color:var(--gold-ink);font-size:12.5px;font-weight:600;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
input[type=text],input[type=password],textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}

/* Login */
.login{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--navy)}
.login-card{background:var(--surface);border-radius:18px;width:100%;max-width:420px;padding:32px;display:grid;gap:16px;border-top:5px solid var(--gold)}
.brandmark{display:flex;align-items:baseline;gap:10px}
.brandmark b{font-family:var(--display);font-weight:900;font-stretch:115%;font-size:24px;letter-spacing:.02em}
.brandmark span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
.demo{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.demo code{font-weight:700;color:var(--ink)}
.err{color:var(--bad);font-size:13px;font-weight:600}

/* Shell */
.mast{background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--gold)}
.mast .in{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast .brandmark span{color:var(--gold)}
.mast .who{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--on-navy-muted)}
.mast .who b{color:var(--on-navy)}
.mast .btn{background:transparent;color:var(--on-navy);border-color:var(--navy-2)}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:16px;align-self:start;display:grid;gap:2px}
.rail button{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
.rail button:hover{background:var(--surface)}
.rail button[aria-current=true]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.big{font-family:var(--display);font-weight:850;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:14px}
.steps div{position:relative;padding-top:22px;font-size:13px}
.steps div::before{content:"";position:absolute;top:6px;left:0;right:0;height:3px;background:var(--line)}
.steps div::after{content:"";position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.steps div.done::before,.steps div.done::after{background:var(--good);border-color:var(--good)}
.steps div.now::after{border-color:var(--gold);background:var(--gold)}
.steps b{display:block;font-size:13.5px}
.steps span{color:var(--muted)}
.list{display:grid;gap:0}
.list > div{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.list > div:first-child{border-top:0}

/* Content */
.weekhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.post:hover{border-color:var(--gold)}
.art{aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:space-between;padding:14px;max-width:100%}
.art.story{aspect-ratio:9/12}
.art .eyebrow{font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.art .hl{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:19px;line-height:1.08}
.art .tag{align-self:flex-start;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
.post .meta{padding:10px 12px;display:grid;gap:6px;font-size:13px}
.post .meta b{font-size:13.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.approve{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.approve:first-of-type{border-top:0}
.cap{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(5,15,20,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:grid;gap:14px}

/* Reports */
.kcats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.krow:first-of-type{border-top:0}
.krow b{font-variant-numeric:tabular-nums;font-family:var(--display)}
.delta{font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body)}

/* Invoices */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.inv{background:#fff;color:#16242B;border-radius:12px;padding:32px;border:1px solid var(--line);display:grid;gap:22px}
.inv .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid #B88A35;padding-bottom:16px}
.inv h2{font-size:28px;color:#0E2A36}
.inv table{min-width:0}
.inv th{background:#F3F5F6;color:#5B6A70}
.inv td,.inv th{border-color:#DCE1DF}
.inv .tot{display:grid;justify-content:end;gap:4px;font-size:15px}
.inv .tot div{display:grid;grid-template-columns:160px 120px;text-align:right}
.inv .tot .grand{font-family:var(--display);font-size:20px;font-weight:800;border-top:2px solid #0E2A36;padding-top:6px}
.inv small{color:#5B6A70}

/* Assets */
.assets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.asset{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.asset .pv{height:130px;display:grid;place-items:center;padding:14px}
.asset .pv svg{max-height:100%;max-width:100%}
.asset .info{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);font-size:13px}
.fmt{display:flex;gap:4px}
.fmt button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:11px;font-weight:700;padding:3px 7px;cursor:pointer}
.fmt button:hover{border-color:var(--gold)}
.sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sw div{display:grid;gap:3px;font-size:12px}
.sw i{display:block;height:70px;border-radius:10px;border:1px solid var(--line)}
.sw code{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.font{border-top:1px dashed var(--line);padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.font:first-of-type{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;max-width:90vw;text-align:center}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:12px}
  .rail{position:static;display:flex;overflow-x:auto;gap:4px}
  .rail button{white-space:nowrap}
  .rail button[aria-current=true]{box-shadow:inset 0 -3px 0 var(--gold)}
  .g3,.g2,.kcats{grid-template-columns:1fr}
  .assets{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sw{grid-template-columns:repeat(3,minmax(0,1fr))}
  .approve{grid-template-columns:1fr}
}
@media (max-width:520px){.assets{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}.inv{padding:18px}}
</style>

function kval(r, k){ if(k==="_er") return r.reach ? r.interactions/r.reach*100 : null; if(k==="_cpr") return r.ad_results ? r.ad_spend/r.ad_results : null; return r[k]; }
function kfmt(k, v){ if(v==null) return "—"; if(k==="_er") return v.toFixed(1)+"%"; if(k==="_cpr") return money(v); return Math.round(v).toLocaleString("en-GB"); }
function lineChart(){
  const months = ["2026-07","2026-08","2026-09"], W = 560, H = 220, l = 56, rgt = 20, t = 24, b = 36;

  const X = i => l + i*(W-l-rgt)/(months.length-1), Y = v => t + (1 - v/max)*(H-t-b);
  const ticks = []; for(let v=0; v<=max; v+=2500) ticks.push(v);
  const pts = vals.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accounts reached rose from 2,900 in July to 9,310 in September">
    ${ticks.map(v=>`<line x1="${l}" x2="${W-rgt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toLocaleString("en-GB")}</text>`).join("")}
    <polygon points="${X(0)},${Y(0)} ${pts} ${X(2)},${Y(0)}" fill="var(--gold)" fill-opacity="0.15"/>

  </svg>`;
}

/* ---------- Brand assets ---------- */
function logoSVG(variant, iconOnly){
  const c = variant==="full" ? {cup:P, steam:A, text:P, sub:S} : variant==="black" ? {cup:"#000",steam:"#000",text:"#000",sub:"#000"} : {cup:"#fff",steam:"#fff",text:"#fff",sub:"#fff"};
  const mark = `<g transform="translate(${iconOnly?10:4},8)"><path d="M6 22h40v14a14 14 0 0 1-14 14h-12a14 14 0 0 1-14-14z" fill="${c.cup}"/><path d="M46 26h4a7 7 0 0 1 0 14h-4" fill="none" stroke="${c.cup}" stroke-width="4"/><path d="M18 4c-4 5 4 8 0 13M28 2c-4 6 4 9 0 15M38 4c-4 5 4 8 0 13" fill="none" stroke="${c.steam}" stroke-width="3" stroke-linecap="round"/></g>`;
  if(iconOnly) return `<svg viewBox="0 0 76 76" width="76" height="76" role="img" aria-label="Kgosi Coffee icon, ${variant}">${mark}</svg>`;
  return `<svg viewBox="0 0 250 72" width="250" height="72" role="img" aria-label="Kgosi Coffee logo, ${variant}">${mark}<text x="72" y="40" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="30" fill="${c.text}">Kgosi</text><text x="73" y="60" font-family="Figtree, sans-serif" font-weight="700" font-size="11" letter-spacing="4.2" fill="${c.sub}">COFFEE CO.</text></svg>`;
}
function hexRgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function cmyk(h){ const [r,g,b] = hexRgb(h).map(v=>v/255); const k = 1-Math.max(r,g,b); if(k>=1) return [0,0,0,100]; return [r,g,b].map(v=>Math.round((1-v-k)/(1-k)*100)).concat(Math.round(k*100)); }
function assetsHTML(){
  const variants = [["full","Full colour","#F7F3EE"],["black","Black","#FFFFFF"],["white","White",P]];
  const card = (svg, label, bg) => `<div class="asset"><div class="pv" style="background:${bg}">${svg}</div><div class="info"><b>${label}</b><div class="fmt">${["SVG","PNG","PDF"].map(f=>`<button type="button" data-dl="${label} ${f}">${f}</button>`).join("")}</div></div></div>`;
  return `<div class="head"><div><h1>Brand assets</h1><p class="sub">Your approved brand kit, moved here from the Midas Design Studio when you signed it off on ${dlabel(CLIENT.kitSigned,{day:"numeric",month:"long",year:"numeric"})}. Use these files whenever anyone designs for you.</p></div><button class="btn pri" type="button" data-dl="Full brand kit (.zip)">Download full kit (.zip)</button></div>
  <div class="grid">
    <section class="panel"><h2>Logo</h2><p class="sub" style="margin-bottom:12px">SVG for any size, PNG with a transparent background for digital, PDF for print.</p><div class="assets">${variants.map(([v,l,bg])=>card(logoSVG(v),l,bg)).join("")}</div></section>
    <section class="panel"><h2>Icon</h2><p class="sub" style="margin-bottom:12px">For profile pictures, favicons and small spaces.</p><div class="assets">${variants.map(([v,l,bg])=>card(logoSVG(v,true),l,bg)).join("")}</div></section>
    <section class="panel"><h2>Colours</h2><p class="sub" style="margin-bottom:12px">Use these exact codes. CMYK is for print; confirm with your printer.</p>
      <div class="sw">${KIT.colors.map(([n,h])=>{ const [r,g,b] = hexRgb(h), [c,m,y,k] = cmyk(h); return `<div><i style="background:${h}"></i><b>${n}</b><code>${h}</code><code>RGB ${r}, ${g}, ${b}</code><code>CMYK ${c}, ${m}, ${y}, ${k}</code></div>`; }).join("")}</div></section>
    <div class="g2">
      <section class="panel"><h2>Fonts</h2><p class="sub">Free Google Fonts, licensed for commercial use.</p>
        ${[["Headings",KIT.heading,"'Fraunces', Georgia, serif","Good coffee, good company"],["Body text",KIT.body,"'Figtree', sans-serif","Roasted in small batches in Gaborone, served with care every morning."]].map(([role,name,stack,sample])=>`<div class="font"><div><div class="label">${role}</div><div style="font-family:${stack};font-size:${role==="Headings"?26:16}px;margin:4px 0;font-weight:${role==="Headings"?700:400}">${sample}</div><span class="sub">${name} · ${KIT.weights[name].join(", ")}</span></div><button class="btn sm" type="button" data-dl="${name} font files">Download</button></div>`).join("")}</section>
      <section class="panel"><h2>Brand guide</h2><p class="sub">3-page PDF: brand sheet, clear space, minimum sizes, do and don't examples, colour pairings and patterns.</p>
        <div class="row" style="margin-top:14px;align-items:stretch">${[1,2,3].map(n=>`<div style="flex:1;min-width:70px;aspect-ratio:1/1.41;border:1px solid var(--line);border-radius:6px;background:${n===1?P:"#fff"};display:grid;place-items:center;padding:6px">${n===1?logoSVG("white",true):`<span style="font-size:11px;color:#5B6A70;font-weight:700">Page ${n}</span>`}</div>`).join("")}</div>
        <button class="btn" type="button" data-dl="Brand guide PDF" style="margin-top:14px">Download brand guide (PDF)</button></section>
    </div>
    <section class="panel"><h2>Patterns & extras</h2><div class="assets" style="margin-top:12px">
      <div class="asset"><div class="pv" style="background:${T};background-image:radial-gradient(${S} 2px, transparent 2.5px);background-size:16px 16px"></div><div class="info"><b>Coffee bean pattern</b><div class="fmt"><button type="button" data-dl="Pattern SVG">SVG</button></div></div></div>
      <div class="asset"><div class="pv" style="background:${P};background-image:repeating-linear-gradient(45deg, ${S} 0 2px, transparent 2px 14px)"></div><div class="info"><b>Stripe texture</b><div class="fmt"><button type="button" data-dl="Texture PNG">PNG</button></div></div></div>
      <div class="asset"><div class="pv" style="background:#F7F3EE"><div style="width:62%;aspect-ratio:4/5;background:${P};border-radius:6px;display:grid;place-items:center;color:${T};font-family:Fraunces,serif;font-weight:700;font-size:13px;text-align:center;padding:8px">Post template</div></div><div class="info"><b>Post template</b><div class="fmt"><button type="button" data-dl="Post template PNG">PNG</button></div></div></div></div></section>
  </div>`;
}

  return `<div class="head"><div><h1>Account</h1><p class="sub">Your plan, your team at Midas and your key documents.</p></div></div>
  <div class="g2"><div class="grid">
    <section class="panel"><div class="row between"><h2>${esc(CLIENT.plan)}</h2><span class="pill s-good">Active</span></div><p class="sub">${money(CLIENT.fee)} a month · since ${dlabel(CLIENT.start,{day:"numeric",month:"long",year:"numeric"})}</p>

/* ================= Events ================= */
document.addEventListener("submit", e=>{
  if(e.target.id!=="loginForm") return; e.preventDefault();
  const id = document.getElementById("cid").value.trim().toUpperCase(), pw = document.getElementById("cpw").value;
  if(id===DEMO.id && pw===DEMO.pw){ authed = true; loginErr = ""; tab = "overview"; render(); window.scrollTo(0,0); }
  else { loginErr = "That client ID and password don't match. Check the welcome message from your account executive."; render(); }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("button, .modal"); if(!t) return;
  const d = t.dataset;
  if(d.close && (t.tagName==="BUTTON" || e.target===t)){ openInv = null; openPost = null; render(); return; }
  if(d.tab){ tab = d.tab; openPost = null; render(); window.scrollTo(0,0); return; }
  if(d.act==="logout"){ authed = false; render(); return; }
  if(d.filter){ filter = d.filter; render(); return; }
  if(d.post){ openPost = d.post; render(); return; }
  if(d.inv){ openInv = d.inv; render(); return; }
  if(d.month){ reportMonth = d.month; render(); return; }
  if(d.act==="octsoon"){ toast("Your October report arrives by 3 November."); return; }
  if(d.approve){ const a = APPROVALS.find(x=>x.key===d.approve); a.state = "approved"; render(); toast("Approved. Midas has been notified."); return; }
  if(d.changes){ const a = APPROVALS.find(x=>x.key===d.changes); a.draft = ""; render(); setTimeout(()=>{ const n = document.getElementById(`note_${a.key}`); if(n) n.focus(); }); return; }
  if(d.cancel){ const a = APPROVALS.find(x=>x.key===d.cancel); delete a.draft; render(); return; }
  if(d.send){ const a = APPROVALS.find(x=>x.key===d.send); const v = document.getElementById(`note_${a.key}`).value.trim(); if(!v){ toast("Tell us what should change first."); return; } a.note = v; a.state = "changes"; delete a.draft; render(); toast("Sent. Midas replies within 48 hours."); return; }
  if(d.undo){ const a = APPROVALS.find(x=>x.key===d.undo); a.state = "waiting"; delete a.note; render(); return; }
  if(d.dl){ toast(`In the live portal, “${d.dl}” downloads here.`); return; }
  if(d.act==="pdf"){ toast("In the live portal, the invoice downloads as a PDF."); return; }
  if(d.act==="pw"){ toast("In the live portal, you'd set a new password here."); return; }
});
document.addEventListener("input", e=>{ const m = e.target.id && e.target.id.match(/^note_(.+)$/); if(m){ const a = APPROVALS.find(x=>x.key===m[1]); if(a) a.draft = e.target.value; } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && (openInv || openPost)){ openInv = null; openPost = null; render(); } });
render();
</script>
