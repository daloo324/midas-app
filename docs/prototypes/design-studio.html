<title>Midas Design Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Source+Sans+3&family=Cormorant+Garamond:wght@600&family=Montserrat&family=DM+Serif+Display&family=DM+Sans&family=Fraunces&family=Manrope:wght@700&family=Work+Sans&family=Space+Grotesk:wght@600&family=IBM+Plex+Sans&family=Raleway:wght@700&family=Open+Sans&family=Nunito:wght@800&family=Nunito+Sans&family=Poppins:wght@600&family=Lora&family=Anton&family=Roboto&family=Bebas+Neue&family=Oswald:wght@600&family=Libre+Baskerville&family=Caveat:wght@700&family=Quicksand&family=Archivo+Black&display=swap">
<style>
/* Layout: navy masthead with a live timer strip; three sections (Clients · Resources · Time). A client opens into a weekly board of deliverable cards with brief, brand kit and time tabs beside it. */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --surface-2:#F7F9F9; --ink:#13252E; --muted:#5A6A72; --line:#D8DFE2;
  --navy:#0E2A36; --navy-2:#18404F; --on-navy:#FFFFFF; --on-navy-muted:#B9C7CD;
  --gold:#B88A35; --gold-soft:#F4ECDC; --gold-ink:#7C5A1A;
  --good:#2E7D4F; --good-soft:#E3F2E8; --warn:#A86A00; --warn-soft:#FBF0D9; --bad:#B3261E; --bad-soft:#FBE4E2; --info:#1F5E8C; --info-soft:#E1EEF7;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1A21; --surface:#12252E; --surface-2:#0F2028; --ink:#E6EDF0; --muted:#94A6AE; --line:#24404C;
  --navy:#081820; --navy-2:#1C4253; --on-navy:#FFFFFF; --on-navy-muted:#9DB0B8;
  --gold:#D4A957; --gold-soft:#2E2715; --gold-ink:#E8C67F;
  --good:#5FBF86; --good-soft:#163024; --warn:#E0A643; --warn-soft:#33270F; --bad:#F08A82; --bad-soft:#3A1A18; --info:#7DB6E0; --info-soft:#14293A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A21; --surface:#12252E; --surface-2:#0F2028; --ink:#E6EDF0; --muted:#94A6AE; --line:#24404C;
  --navy:#081820; --navy-2:#1C4253; --on-navy:#FFFFFF; --on-navy-muted:#9DB0B8;
  --gold:#D4A957; --gold-soft:#2E2715; --gold-ink:#E8C67F;
  --good:#5FBF86; --good-soft:#163024; --warn:#E0A643; --warn-soft:#33270F; --bad:#F08A82; --bad-soft:#3A1A18; --info:#7DB6E0; --info-soft:#14293A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--gold)}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;color:inherit;padding:0;cursor:pointer}
.brand b{font-family:var(--display);font-weight:900;font-stretch:115%;font-size:22px;letter-spacing:.02em}
.brand span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;color:var(--on-navy-muted);font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.nav button[aria-current=true]{background:var(--navy-2);color:var(--on-navy)}
.runbar{background:var(--gold-soft);border-bottom:1px solid var(--line)}
.runbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;font-size:14px}
.runbar b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
main.wrap{padding-block:22px 64px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-weight:850;font-stretch:108%;font-size:clamp(26px,3.4vw,34px);line-height:1.05}
h2{font-weight:800;font-size:19px}
h3{font-weight:700;font-size:15px}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--navy-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .btn.pri{background:var(--gold);border-color:var(--gold);color:#0B1A21}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--gold);border-color:var(--gold);color:#0B1A21}}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#13252E}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:600;cursor:pointer;text-decoration:underline;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:14px}
.notice.err{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.ccard:hover{border-color:var(--gold)}
.ccard .meta{font-size:13px;color:var(--muted)}
.swatches{display:flex;height:10px;border-radius:5px;overflow:hidden}
.swatches i{flex:1}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.empty{border:2px dashed var(--line);border-radius:14px;padding:36px 22px;text-align:center}
.empty p{color:var(--muted);max-width:56ch;margin:8px auto 16px}
.slot{border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;min-height:110px;color:var(--muted);font-weight:600;background:none;cursor:pointer}
.slot:hover{border-color:var(--gold);color:var(--gold-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.s-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.s-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.s-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.s-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.s-gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.month-pick{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month-pick button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.month-pick b{font-family:var(--display);font-weight:700;min-width:120px;text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);font-size:14px;font-weight:500}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}

/* Weeks */
.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.wk{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;min-width:140px}
.wk b{display:block;font-family:var(--display);font-size:14px}
.wk span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.wk .mini{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.wk .mini i{display:block;height:100%;background:var(--good)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.item.running{border-color:var(--bad)}
.item header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.item header .id{font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.item header .date{font-weight:600;font-size:13px}
.item header .sp{flex:1}
.item header select{width:auto;padding:4px 8px;font-size:13px}
.timer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 4px 3px 10px}
.timer b{font-variant-numeric:tabular-nums;font-size:13px;min-width:58px}
.timer button{border:0;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer;background:var(--navy);color:var(--on-navy)}
.timer button.stop{background:var(--bad);color:#fff}
.item .topic{padding:10px 14px 0;font-size:14px}
.item .topic span{color:var(--muted)}
.item .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:10px 14px 14px}
.item .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 14px 12px}
.item .foot input{flex:1;min-width:200px}
.aenotes{margin:8px 14px 0;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}

/* Brief */
.brief-sec{margin-bottom:14px}
.brief-sec h3{margin-bottom:6px}
.brief-row{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:4px 14px;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px}
.brief-row dt{color:var(--muted)}
.brief-row dd{margin:0;white-space:pre-wrap;word-break:break-word}

/* Kit / palette */
.pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pal label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.pal .sw{height:72px;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden}
.pal input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pal code{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.contrast{display:grid;gap:6px;font-size:13px}
.contrast div{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.contrast .chipc{padding:3px 8px;border-radius:6px;font-weight:700;font-size:12px}
.preview{aspect-ratio:1/1;max-width:340px;width:100%;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:26px;border:1px solid var(--line)}
.preview .h{font-size:32px;line-height:1.05}
.preview .b{font-size:14px;line-height:1.45}
.preview .cta{align-self:flex-start;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}

/* Fonts */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.fcard .h{font-size:30px;line-height:1.05;word-break:break-word}
.fcard .b{font-size:14px;line-height:1.5;color:var(--muted)}
.fcard .names{font-size:12.5px;font-weight:700}
.fcard .names span{color:var(--muted);font-weight:500}

/* Inspiration */
.inspo{columns:4 220px;column-gap:12px;margin-top:14px}
.ins{break-inside:avoid;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ins img{width:100%;height:auto;background:var(--surface-2);min-height:80px}
.ins .meta{padding:8px 10px;display:grid;gap:6px;font-size:12.5px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-soft)}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.import{display:grid;gap:10px}
/* Brand kit */
.kit-status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-items:end}
.kgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;align-items:start}
.kgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kslot{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.kslot.empty-slot{border-style:dashed;background:var(--surface-2);cursor:pointer;justify-content:center;min-height:84px}
label.kslot.empty-slot:hover{border-color:var(--gold);background:var(--gold-soft)}
.kname{display:grid;gap:2px;min-width:0}
.kname b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kname span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kprev{height:70px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;padding:6px;background-image:linear-gradient(45deg,rgba(127,127,127,.12) 25%,transparent 25%,transparent 75%,rgba(127,127,127,.12) 75%),linear-gradient(45deg,rgba(127,127,127,.12) 25%,transparent 25%,transparent 75%,rgba(127,127,127,.12) 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.kprev.dark{background-color:#1B2A31}
.kprev img{max-height:100%;max-width:100%;object-fit:contain}
.kprev span{font-family:var(--display);font-weight:800;color:var(--muted)}
.swc{display:grid;gap:3px;font-size:12px}
.swc .sw{height:64px;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;margin-bottom:4px}
.swc input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.swc b{font-size:13px}
.swc code{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fontrole{border-top:1px dashed var(--line);padding-top:12px}
.fontrole:first-child{border-top:0;padding-top:0}
.fsample{font-size:22px;margin:8px 0 10px;line-height:1.2}
.sticky{position:sticky;top:12px}
.locked{border:1px solid var(--line);border-radius:14px;padding:32px 22px;text-align:center;background:var(--surface)}
.locked p{color:var(--muted);max-width:56ch;margin:8px auto 16px}
@media (max-width:900px){.kgrid4{grid-template-columns:repeat(2,minmax(0,1fr))}.kit-status,.kgrid2{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:560px){.kgrid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;max-width:90vw}
@media (max-width:900px){.item .cols{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.pal{grid-template-columns:repeat(3,minmax(0,1fr))}.brief-row{grid-template-columns:1fr}.nav button{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="mast"><div class="wrap">
  <button class="brand" type="button" data-act="home"><b>MIDAS</b><span>Design Studio</span></button>
  <nav class="nav" id="nav"></nav>
</div></header>
<div id="runbar"></div>
<main class="wrap" id="app"><div class="empty"><h2>Loading the studio…</h2></div></main>
<div class="toast" id="toast" hidden></div>
<style id="kitFonts"></style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ================= Constants ================= */
const MAX_CLIENTS = 10;
const DSTATUS = ["To do","In progress","Internal review","With AE","Revisions","Done"];
const DS_CLASS = {"To do":"","In progress":"s-info","Internal review":"s-warn","With AE":"s-gold","Revisions":"s-bad","Done":"s-good"};
const DS_COLOR = {"To do":"var(--line)","In progress":"var(--info)","Internal review":"var(--warn)","With AE":"var(--gold)","Revisions":"var(--bad)","Done":"var(--good)"};
const ROLES = [["primary","Primary"],["secondary","Secondary"],["tertiary","Tertiary"],["accent","Accent"]];
const BLACK = "#000000", WHITE = "#FFFFFF";
const PRESETS = [
  {n:"Midas navy & gold", c:{primary:"#0E2A36",secondary:"#18404F",tertiary:"#4F8C8F",accent:"#C49A47"}},
  {n:"Earth & sand", c:{primary:"#6E4A2B",secondary:"#B98B5E",tertiary:"#E6D2B5",accent:"#2F6B3C"}},
  {n:"Fresh greens", c:{primary:"#2F6B3C",secondary:"#5FA05B",tertiary:"#BFDCA8",accent:"#F2CF45"}},
  {n:"Calm blues", c:{primary:"#1F5E8C",secondary:"#4E9AC7",tertiary:"#BFE0F2",accent:"#F2A65A"}},
  {n:"Warm reds", c:{primary:"#B83A2E",secondary:"#E0663A",tertiary:"#F6D9C7",accent:"#F2CF45"}},
  {n:"Plum & blush", c:{primary:"#4B2B5E",secondary:"#7E4E9C",tertiary:"#E58AAE",accent:"#C49A47"}},
  {n:"Mono & sun", c:{primary:"#1A1A1A",secondary:"#7A7A7A",tertiary:"#D9D9D9",accent:"#F2CF45"}},
  {n:"Teal & coral", c:{primary:"#1D5560",secondary:"#4F8C8F",tertiary:"#CFE3E2",accent:"#E5735C"}}
];
const LOGO_VARIANTS = [["full","Full colour"],["black","Black"],["white","White"]];
const LOGO_FORMATS = ["svg","png","pdf"];

/* ================= Helpers ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const todayYM = todayISO().slice(0,7);
function ymShift(ym, n){ let [y,m] = ym.split("-").map(Number); m += n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; }
function ymLabel(ym){ const [y,m] = ym.split("-").map(Number); return new Date(Date.UTC(y,m-1,1)).toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"}); }
function dlabel(iso, opts){ if(!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-GB",{timeZone:"UTC", ...(opts||{weekday:"short",day:"numeric",month:"short"})}); }
function isoAdd(iso, n){ const [y,m,d] = iso.split("-").map(Number); const t = new Date(Date.UTC(y,m-1,d+n)); return t.toISOString().slice(0,10); }
function mondayOf(iso){ const [y,m,d] = iso.split("-").map(Number); const wd = new Date(Date.UTC(y,m-1,d)).getUTCDay(); return isoAdd(iso, -((wd+6)%7)); }
function setPath(obj, path, val){ const ks = path.split("."); let o = obj; ks.slice(0,-1).forEach(k => o = (o[k] = o[k] || {})); o[ks.at(-1)] = val; return obj; }
function getPath(obj, path){ return path.split(".").reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function hms(ms){ const s = Math.max(0, Math.floor(ms/1000)); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; }
function hm(ms){ const m = Math.round(ms/60000); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${pad(m%60)}`; }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>t.hidden = true, 3000); }
function hexRgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function lum(h){ return hexRgb(h).map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }).reduce((a,v,i)=>a+v*[0.2126,0.7152,0.0722].at(i),0); }
function contrast(a,b){ const [x,y] = [lum(a),lum(b)].sort((p,q)=>q-p); return (x+0.05)/(y+0.05); }
const textOn = bg => contrast(BLACK,bg) >= contrast(WHITE,bg) ? BLACK : WHITE;
function cmyk(h){ const [r,g,b] = hexRgb(h).map(v=>v/255); const k = 1-Math.max(r,g,b); if(k>=1) return [0,0,0,100]; return [r,g,b].map(v=>Math.round((1-v-k)/(1-k)*100)).concat(Math.round(k*100)); }
const kb = n => n>1048576 ? `${(n/1048576).toFixed(1)} MB` : `${Math.max(1,Math.round((n||0)/1024))} KB`;
const kitColors = kit => ({...PRESETS[0].c, ...((kit||{}).colors||{})});
function kitProgress(kit){
  kit = kit || {}; const f = kit.files || {}; let filled = 0, total = 0;
  ["logo","icon"].forEach(p=>LOGO_VARIANTS.forEach(([v])=>LOGO_FORMATS.forEach(fm=>{ total++; if(f[`${p}_${v}_${fm}`]) filled++; })));
  ROLES.forEach(([r])=>{ total++; if((kit.colors||{})[r]) filled++; });
  FONT_ROLES.forEach(([r])=>{ total++; if(WEIGHTS.some(([w])=>f[`font_${r}_${w}`])) filled++; });
  total++; if(f.guide_pdf) filled++;
  return {filled, total, pct: Math.round(filled/total*100)};
}
function kitStack(c, role){
  const kit = c.kit || {}; const f = kit.files || {}; const name = kit[role] || (role==="heading" ? "Archivo Black" : "Work Sans");
  return WEIGHTS.some(([w])=>f[`font_${role}_${w}`]) ? `'Kit-${role}-${c.id}', ${ff(name)}` : ff(name);
}
function kitFontCSS(c){
  if(!c) return ""; const f = (c.kit||{}).files || {}; let css = "";
  FONT_ROLES.forEach(([r])=>WEIGHTS.forEach(([w])=>{ const x = f[`font_${r}_${w}`]; if(x && x.id) css += `@font-face{font-family:'Kit-${r}-${c.id}';src:url('/_blob/${x.id}') format('${FONT_FMT[ext(x.name)]||"truetype"}');font-weight:${w};font-display:swap}\n`; }));
  return css;
}
function parseCSV(text){
  text = text.replace(/^﻿/,""); const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){ const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += ch; }
    else if(ch==='"') q = true; else if(ch===','){ row.push(cell); cell=""; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell += ch; }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
const itemTime = it => (it.timer && it.timer.total || 0) + (it.timer && it.timer.start ? Date.now() - it.timer.start : 0);
const sortSlots = (a,b) => { const o = {P:0,S:1,R:2,A:3}; return (a[1].date||"9").localeCompare(b[1].date||"9") || (o[a[0][0]]??9)-(o[b[0][0]]??9) || a[0].localeCompare(b[0]); };

const months = {}; const subs = new Map();
let view = {sec:"clients", client:null, tab:"board", ym:todayYM, week:null, res:"fonts"};

/* ================= Data ================= */
const chains = {};
function queue(path, fn){
  chains[path] = (chains[path]||Promise.resolve()).then(fn).catch(e=>{
    if(e && e.code==="invalid_argument"){ toast("That change wasn't saved. You may have view-only access."); }
    else if(e && e.code==="quota_exceeded") toast("Storage is full. Remove old inspiration images or clients.");
    else toast("That change didn't save. Check your connection and try again.");
  });
  return chains[path];
}
const writeClient = (id, patch) => queue(`clients/${id}`, ()=> db.doc(`clients/${id}`).update(patch));
const writeMonth = (id, ym, patch) => queue(`clients/${id}/months/${ym}`, ()=> db.doc(`clients/${id}/months/${ym}`).update(patch));

function syncSubs(){
  const want = new Set();
  (clients||[]).forEach(c => want.add(`${c.id}/${todayYM}`));
  if(view.client) want.add(`${view.client}/${view.ym}`);
  if(running && running.ym!=="kit") want.add(`${running.client}/${running.ym}`);
  for(const [k,un] of subs) if(!want.has(k)){ un(); subs.delete(k); delete months[k]; }
  for(const k of want) if(!subs.has(k)){
    const [cid, ym] = k.split("/"); months[k] = undefined;
    subs.set(k, db.doc(`clients/${cid}/months/${ym}`).onSnapshot(s=>{ months[k] = s.exists ? s.data() : null; checkRunning(); requestRender(); }, ()=>{ months[k] = null; requestRender(); }));
  }
}
function timedItem(key, slot){
  const [cid, ym] = key.split("/");
  if(ym==="kit"){ const c = (clients||[]).find(x=>x.id===cid); return c ? (c.kit||{}) : null; }
  const md = months[key]; return md && md.items ? md.items[slot] : null;
}
function writeTimer(key, slot, timer, extra){
  const [cid, ym] = key.split("/");
  if(ym==="kit") return writeClient(cid, {kit:{timer, ...(extra||{})}});
  return writeMonth(cid, ym, {items:{[slot]:{timer, ...(extra||{})}}});
}
function checkRunning(){
  if(!running || clients===null) return; const k = `${running.client}/${running.ym}`;
  if(running.ym!=="kit" && months[k]===undefined) return;
  const it = timedItem(k, running.slot);
  if(!it || !it.timer || !it.timer.start){ setRunning(null); }
}
function setRunning(r){ running = r; try { r ? localStorage.setItem("studio-running", JSON.stringify(r)) : localStorage.removeItem("studio-running"); } catch(e){} renderRunbar(); }
function isEditing(){ const a = document.activeElement; return a && $("#app").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !["checkbox","color","file"].includes(a.type); }
function requestRender(){ if(isEditing()) pendingRender = true; else render(); }
document.addEventListener("focusout", ()=> setTimeout(()=>{ if(pendingRender && !isEditing()){ pendingRender = false; render(); } }, 0));

async function init(){
  try { db = await claude.use("db"); } catch(e){}
  if(!db){ $("#app").innerHTML = `<div class="empty"><h2>Studio unavailable</h2><p>Open this page in Claude while signed in to your Midas Media account.</p></div>`; renderNav(); return; }
  try { user = await claude.use("user"); if(user){ me = await user.id(); const c = await user.can("data.write"); if(c===false) canWrite = false; } } catch(e){}
  try { assets = await claude.use("assets"); } catch(e){ assets = null; }
  db.collection("clients").onSnapshot(snap=>{
    clients = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0));
    if(view.client && !clients.find(c=>c.id===view.client)){ view.client = null; }
    syncSubs(); checkRunning(); requestRender();
  }, ()=>{ $("#app").innerHTML = `<div class="notice err">The client list stopped updating. Reload the page.</div>`; });
  db.collection("inspo").orderBy("created","desc").limit(400).onSnapshot(snap=>{ inspo = snap.docs.map(d=>({id:d.id, ...d.data()})); if(view.sec==="resources" && view.res==="inspo") requestRender(); }, ()=>{});
  setInterval(tick, 1000);
}
function tick(){
  document.querySelectorAll("[data-tick]").forEach(el=>{ const [k, slot] = el.dataset.tick.split("|"); const it = timedItem(k, slot); if(it) el.textContent = hms(itemTime(it)); });
}

/* ================= Render ================= */
function renderNav(){
  $("#nav").innerHTML = [["clients","Clients"],["resources","Resources"],["time","Time"]].map(([k,l])=>`<button type="button" data-sec="${k}" aria-current="${view.sec===k}">${l}</button>`).join("");
}
function renderRunbar(){
  const el = $("#runbar"); if(!running){ el.innerHTML = ""; return; }
  const c = (clients||[]).find(x=>x.id===running.client);
  el.innerHTML = `<div class="runbar"><div class="wrap"><span class="dot"></span><span>Timing <b>${esc(running.slot==="KIT"?"Brand kit":running.slot)}</b> for ${esc(c?c.name:"a client")}</span><b data-tick="${running.client}/${running.ym}|${running.slot}">--:--:--</b><button class="btn sm" type="button" data-timer="${running.slot}" data-k="${running.client}/${running.ym}">Stop</button><button class="link" type="button" data-goto="${running.client}" data-ym="${running.ym}">Open</button></div></div>`;
  tick();
}
function render(){
  renderNav(); renderRunbar();
  if(clients===null) return;
  const app = $("#app");
  const ro = !canWrite ? `<div class="notice" style="margin-bottom:14px">You have view-only access. Ask Dave for Contributor access to make changes.</div>` : "";
  const cur = view.client && clients.find(c=>c.id===view.client);
  const css = view.sec==="clients" && cur ? kitFontCSS(cur) : ""; const st = $("#kitFonts"); if(st.textContent!==css) st.textContent = css;
  app.innerHTML = ro + (view.sec==="resources" ? resourcesHTML() : view.sec==="time" ? timeHTML() : view.client ? clientHTML() : homeHTML());

const dis = () => canWrite ? "" : "disabled";

/* ---------- Home ---------- */
function monthSummary(md){
  const out = {total:0, done:0, ms:0, by:{}};
  if(!md || !md.items) return out;
  Object.values(md.items).forEach(it=>{ out.total++; const s = it.ds||"To do"; out.by[s]=(out.by[s]||0)+1; if(s==="Done") out.done++; out.ms += itemTime(it); });
  return out;
}
function homeHTML(){
  const n = clients.length;
  let h = `<div class="head"><div><h1>Design clients</h1><p class="sub">${esc(ymLabel(todayYM))}. Import each client's brand brief and approved calendar, then work week by week.</p></div>
    <div class="row"><span class="pill">${n} of ${MAX_CLIENTS} slots</span>${canWrite?`<button class="btn pri" type="button" data-act="add" ${n>=MAX_CLIENTS?"disabled":""}>+ Add client</button>`:""}</div></div>`;
  if(adding) h += `<form class="panel" id="addForm" style="margin-bottom:16px"><h2 style="margin-bottom:10px">New client</h2><div class="fgrid"><label class="f">Business name<input type="text" id="new_name" required placeholder="Same name as in the Account Desk"></label><label class="f">Industry<input type="text" id="new_industry"></label></div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Add client</button><button class="btn" type="button" data-act="cancelAdd">Cancel</button></div></form>`;
  if(!n) return h + (adding ? "" : `<div class="empty"><h2>No clients yet</h2><p>Add a client, then import the brand brief CSV from Phase 1 and the calendar CSV the account exec exports from the Account Desk.</p>${canWrite?`<button class="btn pri" type="button" data-act="add">Add your first client</button>`:""}</div>`);
  const cards = clients.map(c=>{
    const md = months[`${c.id}/${todayYM}`]; const s = monthSummary(md); const kit = c.kit||{};
    return `<button class="ccard" type="button" data-open="${c.id}">
      <div class="swatches">${ROLES.map(([r])=>`<i style="background:${esc((kit.colors||{})[r]||"var(--line)")}"></i>`).join("")}</div>
      <div><h3 style="font-size:17px">${esc(c.name)}</h3><div class="meta">${esc(c.industry||"")}${kit.heading?` · ${esc(kit.heading)} + ${esc(kit.body||"")}`:""}</div></div>
      ${kit.status!=="Done" ? `<div class="kv"><span>Brand kit</span><span>${esc(kit.status||"To do")}</span><span>Kit items ready</span><span>${kitProgress(kit).filled} / ${kitProgress(kit).total}</span><span>Content creation</span><span>Locked until sign-off</span></div>` : md===undefined?`<div class="meta">Loading…</div>`: md===null?`<div class="notice">${esc(ymLabel(todayYM))} calendar not imported</div>`:`
      <div class="bar">${DSTATUS.map(st=>{ const v = s.by[st]||0; return v?`<i style="width:${v/s.total*100}%;background:${DS_COLOR[st]}"></i>`:""; }).join("")}</div>
      <div class="kv"><span>Done</span><span>${s.done} / ${s.total}</span><span>Time logged</span><span>${hm(s.ms)}</span><span>Brief</span><span>${(c.brief||[]).length?"Imported":"Missing"}</span></div>`}
    </button>`;
  }).join("");
  return h + `<div class="grid">${cards}${canWrite && n<MAX_CLIENTS && !adding ? `<button class="slot" type="button" data-act="add">+ Add client (${MAX_CLIENTS-n} free)</button>`:""}</div>`;
}

    ${showMonth?`<div class="month-pick"><button type="button" data-act="prev" aria-label="Previous month">‹</button><b>${esc(ymLabel(view.ym))}</b><button type="button" data-act="next" aria-label="Next month">›</button></div>`:""}</div>

function weeksOf(md, ym){
  const [y,m] = ym.split("-").map(Number); const first = `${ym}-01`; const last = `${ym}-${pad(new Date(Date.UTC(y,m,0)).getUTCDate())}`;
  const weeks = []; for(let w = mondayOf(first); w <= last; w = isoAdd(w,7)) weeks.push({start:w, end:isoAdd(w,6), items:[]});
  const loose = {start:"", end:"", items:[], loose:true};
  Object.entries(md.items||{}).sort(sortSlots).forEach(e=>{ const d = e[1].date; const wk = d && weeks.find(w=>d>=w.start && d<=w.end); (wk||loose).items.push(e); });
  if(loose.items.length) weeks.push(loose);
  return weeks.filter(w=>w.items.length || !w.loose);
}
function boardHTML(c, md){
  const weeks = weeksOf(md, view.ym);
  if(view.week==null || view.week>=weeks.length){ const t = todayISO(); const i = weeks.findIndex(w=>t>=w.start && t<=w.end); view.week = i>=0 ? i : weeks.findIndex(w=>w.items.length); if(view.week<0) view.week = 0; }
  const wk = weeks[view.week]; const key = `${c.id}/${view.ym}`;
  const chips = weeks.map((w,i)=>{ const done = w.items.filter(([,it])=>it.ds==="Done").length; return `<button class="wk" type="button" data-week="${i}" aria-pressed="${i===view.week}"><b>${w.loose?"No date":`Week ${i+1}`}</b><span>${w.loose?"Unscheduled":`${dlabel(w.start,{day:"numeric",month:"short"})} – ${dlabel(w.end,{day:"numeric",month:"short"})}`} · ${done}/${w.items.length}</span><div class="mini"><i style="width:${w.items.length?done/w.items.length*100:0}%"></i></div></button>`; }).join("");
  const kit = c.kit || {};
  const cards = wk.items.length ? wk.items.map(([id,it])=>itemHTML(key, id, it, kit)).join("") : `<div class="notice">Nothing scheduled this week.</div>`;
  const empties = wk.items.filter(([,it])=>!it.visual || !it.graphic || !it.caption).length;
  return `<div class="weeks">${chips}</div>
    <div class="row between" style="margin-bottom:12px"><div><h2>${wk.loose?"Unscheduled":`Week ${view.week+1} · ${esc(dlabel(wk.start,{day:"numeric",month:"long"}))} – ${esc(dlabel(wk.end,{day:"numeric",month:"long"}))}`}</h2><p class="sub">${wk.items.length} deliverables. Suggestions only fill empty fields; clear a field to get a new one.</p></div>
    ${canWrite?`<button class="btn gold" type="button" data-suggest="week" ${empties&&!busy.week?"":"disabled"}>${busy.week?"Writing suggestions…":`Suggest visuals & copy for this week${empties?` (${empties})`:""}`}</button>`:""}</div>
    ${cards}`;
}
function itemHTML(key, id, it, kit){
  const on = it.timer && it.timer.start; const mine = on && running && running.slot===id && `${running.client}/${running.ym}`===key;

function previewHTML(col, hStack, bStack, name){
  const fg = textOn(col.primary); const eyebrow = contrast(col.tertiary, col.primary) >= 3 ? col.tertiary : fg;
  return `<div class="preview" style="background:${esc(col.primary)};color:${fg}"><div style="font-family:${hStack};font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:${esc(eyebrow)}">${esc(name||"Brand name")}</div><div><div class="h" style="font-family:${hStack}">Good brands build brighter tomorrows</div><p class="b" style="font-family:${bStack};margin:10px 0 0;opacity:.9">A sample post using this palette and type pairing, so you can judge both together.</p></div><div class="row" style="justify-content:space-between"><span class="cta" style="background:${esc(col.accent)};color:${textOn(col.accent)};font-family:${bStack}">Book now</span><span style="display:inline-flex;gap:5px">${[col.secondary,col.tertiary].map(x=>`<i style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${esc(x)};border:1px solid rgba(127,127,127,.4)"></i>`).join("")}</span></div></div>`;
}
function contrastHTML(col){
  const rows = ROLES.flatMap(([r,l])=>[[`White on ${l}`, WHITE, col[r]],[`Black on ${l}`, BLACK, col[r]]]);
  return `<h3 style="margin:16px 0 8px">Colour pairings</h3><div class="contrast">${rows.map(([l,fg,bg])=>{ const r = contrast(fg,bg); const ok = r>=4.5 ? ["Body text OK","s-good"] : r>=3 ? ["Large text only","s-warn"] : ["Avoid","s-bad"]; return `<div><span class="chipc" style="background:${esc(bg)};color:${fg}">Aa</span><span>${l}</span><b style="font-variant-numeric:tabular-nums">${r.toFixed(1)}:1</b><span class="pill ${ok[1]}">${ok[0]}</span></div>`; }).join("")}</div>`;
}

function clientTimeHTML(c, md){
  const rows = Object.entries(md.items||{}).sort(sortSlots);
  const byType = {}; let tot = 0, done = 0;
  rows.forEach(([,it])=>{ const t = it.type.startsWith("Ad")?"Ad":it.type; const ms = itemTime(it); tot += ms; (byType[t] = byType[t] || {n:0, ms:0, timed:0}); byType[t].n++; byType[t].ms += ms; if(ms>0) byType[t].timed++; if(it.ds==="Done") done++; });
  const rate = tot>0 ? 3250 / (tot/3600000) : null;
  return `<div class="stat"><div><b>${hm(tot)}</b><span>Time logged this month</span></div><div><b>${hm(itemTime(c.kit||{}))}</b><span>Brand kit, once-off</span></div><div><b>${done} / ${rows.length}</b><span>Deliverables done</span></div>
    ${Object.entries(byType).map(([t,v])=>`<div><b>${v.timed?hm(v.ms/v.timed):"—"}</b><span>Average per ${t.toLowerCase()} (${v.timed} timed)</span></div>`).join("")}
    <div><b>${rate?`P${Math.round(rate).toLocaleString("en-GB")}`:"—"}</b><span>Effective rate per hour at P3,250</span></div></div>
    <div class="tbl"><table><thead><tr><th>Slot</th><th>Format</th><th>Date</th><th>Design status</th><th class="num">Time</th><th class="num">Adjust (minutes)</th></tr></thead><tbody>
    ${rows.map(([id,it])=>`<tr><td><b>${esc(id)}</b></td><td>${esc(it.type)}</td><td>${esc(dlabel(it.date))}</td><td><span class="pill ${DS_CLASS[it.ds||"To do"]}">${esc(it.ds||"To do")}</span></td><td class="num" data-tick="${c.id}/${view.ym}|${id}">${hms(itemTime(it))}</td><td class="num" style="width:150px"><input type="number" min="0" step="1" data-adjust="${id}" id="adj_${id}" value="${Math.round(((it.timer&&it.timer.total)||0)/60000)}" ${it.timer&&it.timer.start||!canWrite?"disabled":""} aria-label="${id} minutes"></td></tr>`).join("")}</tbody></table></div>
    <p class="sub">Effective rate counts design time only, against the Brand Launch fee. Use Adjust when a timer was forgotten.</p>`;
}

async function importCSV(text){

  if(head[0]==="section" && head[1]==="question"){
    const brief = rows.slice(1).map(r=>({s:r[0]||"", q:r[1]||"", a:(r[2]||"").trim()}));
    await writeClient(c.id, {brief, briefDate:Date.now()}); view.tab = "brief"; render(); toast(`Brand brief imported: ${brief.filter(r=>r.a).length} answers.`); return;
  }
  const col = n => head.indexOf(n);
  if(col("slot")<0 || col("month")<0){ toast("Not a calendar or brief CSV. Export it from the Account Desk or the questionnaire."); return; }
  const data = rows.slice(1).filter(r=>r[col("slot")]);
  const names = [...new Set(data.map(r=>(r[col("client")]||"").trim()).filter(Boolean))];
  if(names.length && !names.some(n=>n.toLowerCase()===c.name.toLowerCase())){ toast(`This calendar is for ${names[0]}, not ${c.name}. Open that client and import it there.`); return; }
  const ym = (data[0][col("month")]||"").trim(); if(!/^\d{4}-\d{2}$/.test(ym)){ toast("The Month column must look like 2026-11."); return; }
  const ref = db.doc(`clients/${c.id}/months/${ym}`); let existing = null;
  try { const s = await ref.get(); existing = s.exists ? s.data() : null; } catch(e){ toast("Couldn't read the month. Try again."); return; }
  const items = {};
  data.forEach(r=>{ const id = r[col("slot")].trim(); const base = {type:r[col("format")]||"", date:r[col("date")]||"", pillar:r[col("pillar")]||"", topic:r[col("topic")]||"", platform:r[col("platform")]||"", aeStatus:r[col("ae status")]||"", notes:r[col("notes")]||""};
    items[id] = existing && existing.items && existing.items[id] ? base : {...base, ds:"To do", visual:"", graphic:"", caption:"", hashtags:"", file:"", timer:{start:null, total:0}}; });
  await queue(ref.path, ()=> existing ? ref.update({items, imported:Date.now()}) : ref.set({items, imported:Date.now(), created:Date.now()}));
  view.ym = ym; view.tab = "board"; view.week = null; syncSubs(); render(); toast(`${ymLabel(ym)} imported: ${data.length} deliverables.`);

async function suggest(target){

CLIENT: ${c.name}${c.industry?` (${c.industry})`:""}
BRAND KIT: colours ${ROLES.map(([r,l])=>`${l.toLowerCase()} ${(kit.colors||{})[r]||"not set"}`).join(", ")}, plus black and white; heading font ${kit.heading||"not set"}, body font ${kit.body||"not set"}.
BRAND VOICE: ${kit.voice||"Not set; infer from the brief."}
DESIGNER NOTES: ${c.designNotes||"None."}
BRAND BRIEF (client's own answers):
${brief||"Not imported. Keep suggestions general and professional."}

DELIVERABLES:
${slots.map(([id,it])=>`- ${id} | ${it.type} | ${it.date||"no date"} | pillar: ${it.pillar} | platform: ${it.platform} | topic: ${it.topic||"none given"}${it.notes?` | notes: ${it.notes}`:""}`).join("\n")}

For each deliverable write:

- "graphic": the text that appears on the design, at most 8 words.

  } catch(e){

function uploadErr(e){ return e && e.code==="too_large" ? "That file is too large." : e && e.code==="unsupported_type" ? "That file type isn't supported." : e && e.code==="quota_exceeded" ? "Storage is full." : "Upload failed. Try again."; }
async function uploadKit(slot, file){
  if(!assets){ toast("Uploading needs Contributor access or higher."); return; }
  const e = ext(file.name), want = slot.split("_").pop();
  if(/^(logo|icon)_/.test(slot) && e!==want){ toast(`This slot takes a .${want} file.`); return; }
  if(/^font_/.test(slot) && !FONT_FMT[e]){ toast("Upload a TTF, OTF, WOFF or WOFF2 font file."); return; }
  if(slot==="guide_pdf" && e!=="pdf"){ toast("The brand guide must be a PDF."); return; }
  const c = clients.find(x=>x.id===view.client); const old = ((c.kit||{}).files||{})[slot];
  busy[slot] = true; render();
  try {
    const r = await assets.upload(file, {type: MIME[e] || file.type});
    await writeClient(c.id, {kit:{files:{[slot]:{id:r.id, name:file.name, size:r.sizeBytes||file.size, type:r.contentType||MIME[e]||""}}}});
    if(old && old.id){ try { await assets.delete(old.id); } catch(err){} }
    toast(`${file.name} uploaded.`);
  } catch(err){ toast(uploadErr(err)); }
  finally { busy[slot] = false; requestRender(); }
}
async function removeKit(slot){
  const c = clients.find(x=>x.id===view.client); const old = ((c.kit||{}).files||{})[slot];

async function uploadExtras(files){
  if(!assets) return; const c = clients.find(x=>x.id===view.client); const add = [];

async function removeExtra(i){

const safeName = c => c.name.replace(/[^\w]+/g,"-").replace(/^-|-$/g,"");
function kitFileName(c, slot, f){
  const n = safeName(c);
  const m = slot.match(/^(logo|icon)_(\w+)_(\w+)$/);
  if(m){ const v = LOGO_VARIANTS.find(x=>x[0]===m[2]); return `${n}_${m[1]==="logo"?"Logo":"Icon"}_${v?v[1].replace(/\s/g,"-"):m[2]}.${m[3]}`; }
  if(slot==="guide_pdf") return `${n}_Brand-Guide.pdf`;
  return f.name;
}
function kitFolder(slot){ return slot.startsWith("logo_") ? "Logo/" : slot.startsWith("icon_") ? "Icon/" : slot.startsWith("font_") ? "Fonts/" : slot==="guide_pdf" ? "Brand-Guide/" : "Other/"; }
function coloursText(c){
  const col = kitColors(c.kit);
  const line = (l, h) => { const [R,G,B] = hexRgb(h), [C,M,Y,K] = cmyk(h); return `${l}\n  HEX  ${h.toUpperCase()}\n  RGB  ${R}, ${G}, ${B}\n  CMYK ${C}, ${M}, ${Y}, ${K} (approximate)\n`; };
  const k = c.kit || {};
  return `${c.name} brand colours\n\n` + ROLES.map(([r,l])=>line(l, col[r])).join("\n") + "\n" + line("Black", BLACK) + "\n" + line("White", WHITE) + `\nFonts\n  Heading: ${k.heading||"not set"}\n  Body: ${k.body||"not set"}\n`;
}
async function getDownloads(){ let dl = null; try { dl = await claude.use("downloads"); } catch(e){} if(!dl) toast("Downloads aren't available in this view."); return dl; }
async function fetchBlob(id){ const r = await fetch(`/_blob/${id}`); if(!r.ok) throw new Error("fetch"); return r.blob(); }
async function downloadOne(f, filename){
  const dl = await getDownloads(); if(!dl) return;
  try {
    let blob = await fetchBlob(f.id), name = filename;
    if(!DL_OK.has(ext(filename))){ if(!window.JSZip) throw new Error("zip"); const z = new JSZip(); z.file(filename, blob); blob = await z.generateAsync({type:"blob"}); name = filename + ".zip"; }
    await dl.save({filename:name, data:blob});
  } catch(e){ if(!(e && e.code==="declined")) toast("Download failed. Try again."); }
}
async function zipKit(){
  const c = clients.find(x=>x.id===view.client); if(!window.JSZip){ toast("The zip tool didn't load. Reload the page."); return; }
  const dl = await getDownloads(); if(!dl) return;
  const kit = c.kit || {}, root = `${safeName(c)}-Brand-Kit/`;
  busy.zip = true; render();
  try {
    const z = new JSZip();
    const entries = Object.entries(kit.files||{}).filter(([,f])=>f && f.id).map(([slot,f])=>[kitFolder(slot) + kitFileName(c, slot, f), f]);
    (kit.extras||[]).forEach(f=>entries.push(["Patterns-and-extras/" + f.name, f]));
    for(const [path, f] of entries) z.file(root + path, await fetchBlob(f.id));
    z.file(root + "Colours-and-fonts.txt", coloursText(c));
    const blob = await z.generateAsync({type:"blob"});
    await dl.save({filename:`${safeName(c)}-Brand-Kit.zip`, data:blob});
  } catch(e){ if(!(e && e.code==="declined")) toast("Couldn't build the zip. Try again."); }
  finally { busy.zip = false; requestRender(); }
}

  if(!t.dataset.scope) return;
  const patch = setPath({}, t.dataset.path, t.type==="checkbox" ? t.checked : t.value);
  if(t.dataset.scope==="client") writeClient(view.client, patch); else writeMonth(view.client, view.ym, patch);
  if(t.tagName==="SELECT") t.blur();
});
document.addEventListener("dragover", e=>{ const z = e.target.closest("#csvDrop,#inspoDrop"); if(z){ e.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const z = e.target.closest("#csvDrop,#inspoDrop"); if(z) z.classList.remove("over"); });
document.addEventListener("drop", e=>{ const z = e.target.closest("#csvDrop,#inspoDrop"); if(!z) return; e.preventDefault(); z.classList.remove("over"); if(!canWrite) return;
  if(z.id==="csvDrop"){ const f = e.dataTransfer.files[0]; if(f) f.text().then(importCSV); } else uploadInspo(e.dataTransfer.files); });

renderNav();
init();
</script>
